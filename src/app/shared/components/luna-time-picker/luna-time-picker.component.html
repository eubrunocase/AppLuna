<div class="luna-time-picker" role="group" aria-label="Selecione o horário">
  <p class="luna-time-picker__time-value">{{ formattedTimeLabel() }}</p>

  <div class="luna-time-picker__wheels">
    <div class="luna-time-picker__wheel-col">
      <span class="luna-time-picker__wheel-label">Hora</span>
      <div class="luna-time-picker__wheel-mask">
        <div #wheel class="luna-time-picker__wheel" (scroll)="onWheelScroll('hour', $event)">
          @for (hour of hourOptions(); track hour) {
            <div
              class="luna-time-picker__wheel-item"
              [class.luna-time-picker__wheel-item--active]="hour === selectedHour()"
            >
              {{ hour | number: '2.0-0' }}
            </div>
          }
        </div>
      </div>
    </div>

    <div class="luna-time-picker__wheel-col">
      <span class="luna-time-picker__wheel-label">Min</span>
      <div class="luna-time-picker__wheel-mask">
        <div #wheel class="luna-time-picker__wheel" (scroll)="onWheelScroll('minute', $event)">
          @for (minute of minuteOptions(); track minute) {
            <div
              class="luna-time-picker__wheel-item"
              [class.luna-time-picker__wheel-item--active]="minute === selectedMinute()"
            >
              {{ minute | number: '2.0-0' }}
            </div>
          }
        </div>
      </div>
    </div>

    <div class="luna-time-picker__highlight" aria-hidden="true"></div>
  </div>
</div>
