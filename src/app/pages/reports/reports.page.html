@if (layout.isDesktop()) {
  <app-reports-desktop
    [step]="step()"
    [report]="report()"
    [isLoading]="isLoading()"
    [isExporting]="isExporting()"
    [selectedFormat]="selectedFormat()"
    [periodLabel]="periodLabel()"
    [canContinuePreview]="canContinuePreview()"
    [pickerDate]="pickerDate()"
    [minPickerDate]="minPickerDate"
    [maxPickerDate]="maxPickerDate"
    [formatOptions]="formatOptions"
    (periodChange)="onPeriodChange($event)"
    (goToStep)="goToStep($event)"
    (formatChange)="selectedFormat.set($event)"
    (export)="exportReport()"
  />
} @else {
  <app-reports-mobile
    [step]="step()"
    [report]="report()"
    [isLoading]="isLoading()"
    [isExporting]="isExporting()"
    [selectedFormat]="selectedFormat()"
    [periodLabel]="periodLabel()"
    [canContinuePreview]="canContinuePreview()"
    [pickerDate]="pickerDate()"
    [minPickerDate]="minPickerDate"
    [maxPickerDate]="maxPickerDate"
    [skeletonItems]="skeletonItems"
    [itemSize]="itemSize"
    [formatOptions]="formatOptions"
    (periodChange)="onPeriodChange($event)"
    (goToStep)="goToStep($event)"
    (formatChange)="selectedFormat.set($event)"
    (export)="exportReport()"
  />
}
