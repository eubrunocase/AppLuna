@if (layout.isDesktop()) {
  <app-users-desktop
    [roleFilters]="roleFilters"
    [roleFilter]="roleFilter"
    [searchQuery]="searchQuery"
    [isLoading]="isLoading"
    [filteredUsers]="filteredUsers"
    [processingId]="processingId"
    [currentUserId]="currentUserId"
    (roleFilterChange)="setRoleFilter($event)"
    (searchQueryChange)="setSearchQuery($event)"
    (edit)="openEdit($event)"
    (deleteUser)="askDelete($event)"
    (create)="openCreate()"
    (refreshList)="loadUsers()"
  />
} @else {
  <app-users-mobile
    [roleFilters]="roleFilters"
    [roleFilter]="roleFilter"
    [searchQuery]="searchQuery"
    [isLoading]="isLoading"
    [skeletonItems]="skeletonItems"
    [compactSkeletonItems]="compactSkeletonItems"
    [filteredUsers]="filteredUsers"
    [itemSize]="itemSize"
    [compactItemSize]="compactItemSize"
    [processingId]="processingId"
    [currentUserId]="currentUserId"
    (refresh)="refresh($event)"
    (roleFilterChange)="setRoleFilter($event)"
    (searchQueryChange)="setSearchQuery($event)"
    (edit)="openEdit($event)"
    (deleteUser)="askDelete($event)"
    (create)="openCreate()"
  />
}

<app-confirm-dialog
  #confirmDialog
  [title]="confirmTitle"
  [description]="confirmDescription"
  [confirmLabel]="confirmLabel"
  icon="lucideTriangleAlert"
  (confirmed)="confirmDelete()"
/>
