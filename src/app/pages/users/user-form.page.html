@if (layout.isDesktop()) {
  <app-user-form-desktop
    [step]="step()"
    [isEdit]="isEdit()"
    [isLoadingUser]="isLoadingUser()"
    [isSubmitting]="isSubmitting()"
    [submitted]="submitted()"
    [showPassword]="showPassword()"
    [selectedRole]="selectedRole()"
    [canProceedStep1]="canProceedStep1()"
    [canSubmit]="canSubmit()"
    [form]="form"
    [roleOptions]="roleOptions"
    (showPasswordChange)="showPassword.set($event)"
    (selectedRoleChange)="selectedRole.set($event)"
    (goToStep)="goToStep($event)"
    (submit)="onSubmit()"
  />
} @else {
  <app-user-form-mobile
    [step]="step()"
    [isEdit]="isEdit()"
    [isLoadingUser]="isLoadingUser()"
    [isSubmitting]="isSubmitting()"
    [submitted]="submitted()"
    [showPassword]="showPassword()"
    [selectedRole]="selectedRole()"
    [canProceedStep1]="canProceedStep1()"
    [canSubmit]="canSubmit()"
    [form]="form"
    [roleOptions]="roleOptions"
    (showPasswordChange)="showPassword.set($event)"
    (selectedRoleChange)="selectedRole.set($event)"
    (goToStep)="goToStep($event)"
    (submit)="onSubmit()"
  />
}
