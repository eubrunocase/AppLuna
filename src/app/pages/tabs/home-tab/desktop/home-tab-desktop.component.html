<div class="desktop-page">
  <div class="desktop-page__toolbar">
    <div>
      <h1 class="text-xl font-bold text-[#361a14] m-0">Painel</h1>
      <p class="m-0 mt-1 text-sm text-[#8a6f66]">Resumo do condomínio</p>
    </div>
  </div>

  <div class="desktop-page__stats" role="region" aria-label="Resumo rápido">
    @if (isLoadingStats()) {
      @for (item of statSkeletonItems(); track item) {
        <div class="desktop-page__stat" aria-hidden="true">
          <span hlmSkeleton class="block h-3 w-24 rounded"></span>
          <span hlmSkeleton class="mt-3 block h-8 w-12 rounded"></span>
        </div>
      }
    } @else {
      @if (isAdmin()) {
        <button type="button" class="desktop-page__stat text-left cursor-pointer" (click)="pendingApprovalsClick.emit()">
          <p class="desktop-page__stat-label">
            <ng-icon name="lucideClipboardList" class="inline-block align-middle me-1" />
            Aprovações pendentes
          </p>
          <p class="desktop-page__stat-value">{{ pendingApprovals() }}</p>
        </button>
      }

      <button type="button" class="desktop-page__stat text-left cursor-pointer" (click)="deliveriesClick.emit()">
        <p class="desktop-page__stat-label">
          <ng-icon name="lucidePackage" class="inline-block align-middle me-1" />
          Encomendas
        </p>
        <p class="desktop-page__stat-value">{{ pendingDeliveries() }}</p>
      </button>

      @if (canSeeReservationsSummary()) {
        <button type="button" class="desktop-page__stat text-left cursor-pointer" (click)="reservationsClick.emit()">
          <p class="desktop-page__stat-label">
            <ng-icon name="lucideCalendar" class="inline-block align-middle me-1" />
            Reservas ativas
          </p>
          <p class="desktop-page__stat-value">{{ activeReservations() }}</p>
        </button>
      }
    }
  </div>

  <section class="desktop-page__panel p-5" aria-labelledby="desktop-notices-title">
    <div class="flex gap-3 items-start">
      <span class="flex shrink-0 items-center justify-center w-10 h-10 rounded-xl bg-[rgba(192,92,70,0.1)] text-[#c05c46]">
        <ng-icon name="lucideInfo" />
      </span>
      <div>
        <h2 id="desktop-notices-title" class="m-0 text-sm font-bold text-[#361a14]">Avisos</h2>
        <p class="m-0 mt-1 text-sm text-[#8a6f66]">
          Revise suas informações na área de gerenciamento para receber avisos e entregas corretamente.
        </p>
      </div>
    </div>
  </section>
</div>
