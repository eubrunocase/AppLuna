@if (layout.isDesktop()) {
  <app-deliveries-tab-desktop
    [statusFilters]="statusFilters"
    [statusFilter]="statusFilter"
    [isLoading]="isLoading"
    [filteredDeliveries]="filteredDeliveries"
    [canCreate]="canCreate"
    [photoById]="photoMap"
    (statusFilterChange)="setStatusFilter($event)"
    (create)="openCreate()"
    (refreshList)="loadDeliveries()"
  />
} @else {
  <app-deliveries-tab-mobile
    [statusFilters]="statusFilters"
    [statusFilter]="statusFilter"
    [isLoading]="isLoading"
    [skeletonItems]="skeletonItems"
    [filteredDeliveries]="filteredDeliveries"
    [itemSize]="itemSize"
    [canCreate]="canCreate"
    [photoById]="photoMap"
    (refresh)="refresh($event)"
    (statusFilterChange)="setStatusFilter($event)"
    (create)="openCreate()"
  />
}
