@if (layout.isDesktop()) {
  <app-reservations-tab-desktop
    [isAdmin]="isAdmin"
    [viewMode]="viewMode"
    [pendingApprovalCount]="pendingApprovalCount"
    [typeFilters]="typeFilters"
    [statusFilters]="statusFilters"
    [typeFilter]="typeFilter"
    [statusFilter]="statusFilter"
    [isLoading]="isLoading"
    [filteredReservations]="filteredReservations"
    [processingId]="processingId"
    (focusPending)="focusPending()"
    (viewModeChange)="setViewMode($event)"
    (typeFilterChange)="setTypeFilter($event)"
    (statusFilterChange)="setStatusFilter($event)"
    (approve)="approveReservation($event)"
    (reject)="rejectReservation($event)"
    (cancelSpace)="cancelSpaceReservation($event)"
    (cancelEquipment)="cancelEquipmentReservation($event)"
    (create)="openNewReservation()"
    (refreshList)="loadReservations()"
  />
} @else {
  <app-reservations-tab-mobile
    [isAdmin]="isAdmin"
    [viewMode]="viewMode"
    [pendingApprovalCount]="pendingApprovalCount"
    [typeFilters]="typeFilters"
    [statusFilters]="statusFilters"
    [typeFilter]="typeFilter"
    [statusFilter]="statusFilter"
    [isLoading]="isLoading"
    [skeletonItems]="skeletonItems"
    [filteredReservations]="filteredReservations"
    [itemSize]="itemSize"
    [processingId]="processingId"
    (refresh)="refresh($event)"
    (focusPending)="focusPending()"
    (viewModeChange)="setViewMode($event)"
    (typeFilterChange)="setTypeFilter($event)"
    (statusFilterChange)="setStatusFilter($event)"
    (approve)="approveReservation($event)"
    (reject)="rejectReservation($event)"
    (cancelSpace)="cancelSpaceReservation($event)"
    (cancelEquipment)="cancelEquipmentReservation($event)"
    (create)="openNewReservation()"
  />
}

<app-confirm-dialog
  #confirmDialog
  [title]="confirmTitle"
  [description]="confirmDescription"
  [confirmLabel]="confirmLabel"
  [icon]="confirmIcon"
  (confirmed)="confirmDialogAction()"
/>
