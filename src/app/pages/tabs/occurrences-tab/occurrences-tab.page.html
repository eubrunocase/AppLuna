@if (layout.isDesktop()) {
  <app-occurrences-tab-desktop
    [isLoading]="isLoading"
    [occurrences]="occurrences"
    (create)="openNewOccurrence()"
    (refreshList)="loadOccurrences()"
  />
} @else {
  <app-occurrences-tab-mobile
    [isLoading]="isLoading"
    [skeletonItems]="skeletonItems"
    [occurrences]="occurrences"
    [itemSize]="itemSize"
    (refresh)="refresh($event)"
    (create)="openNewOccurrence()"
  />
}
