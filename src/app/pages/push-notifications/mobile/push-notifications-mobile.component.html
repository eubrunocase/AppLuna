<ion-content class="shell-page-content push-mobile-content">
  <div class="push-mobile-shell">
    <div hlmCard class="info-card">
      <div hlmCardHeader>
        <h2 hlmCardTitle class="info-card__title">
          <ng-icon name="lucideBell" />
          Push Notifications
        </h2>
      </div>
      <div hlmCardContent>
        <p>Receba notificações em tempo real sobre ocorrências e eventos do condomínio.</p>
        <p class="info-text">
          <ng-icon name="lucideInfo" />
          Utilizamos Web Push nativo com VAPID — sem Firebase.
        </p>
      </div>
    </div>

    <div hlmCard class="status-card">
      <div hlmCardHeader>
        <p hlmCardDescription>Status da inscrição</p>
      </div>
      <div hlmCardContent>
        <div class="status-indicator" [class.status-indicator--active]="isSubscribed()">
          <ng-icon [name]="isSubscribed() ? 'lucideCircleCheck' : 'lucideCircleAlert'" />
          <span>{{ isSubscribed() ? 'Inscrito' : 'Não inscrito' }}</span>
        </div>
      </div>
    </div>

    <button
      hlmBtn
      type="button"
      class="toggle-btn"
      [variant]="isSubscribed() ? 'destructive' : 'default'"
      [disabled]="isLoading()"
      (click)="toggle.emit()"
    >
      @if (isLoading()) {
        <hlm-spinner />
      } @else {
        <ng-icon [name]="isSubscribed() ? 'lucideBellOff' : 'lucideBell'" />
        {{ isSubscribed() ? 'Desativar Notificações' : 'Ativar Notificações' }}
      }
    </button>

    @if (errorMessage()) {
      <div class="error-message" role="alert">
        <ng-icon name="lucideCircleAlert" />
        <span>{{ errorMessage() }}</span>
      </div>
    }
  </div>
</ion-content>
