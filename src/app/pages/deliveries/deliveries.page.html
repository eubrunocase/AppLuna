@if (layout.isDesktop()) {
  <app-deliveries-desktop
    [statusFilters]="statusFilters"
    [statusFilter]="statusFilter"
    [isLoading]="isLoading"
    [filteredDeliveries]="filteredDeliveries"
    [canCreate]="canCreate"
    [canConfirm]="canConfirm"
    [userNames]="userNamesMap"
    (statusFilterChange)="setStatusFilter($event)"
    (create)="openCreateModal()"
    (confirmPickup)="openPickupDialog($event)"
    (refreshList)="loadData()"
  />
} @else {
  <app-deliveries-mobile
    [statusFilters]="statusFilters"
    [statusFilter]="statusFilter"
    [isLoading]="isLoading"
    [skeletonItems]="skeletonItems"
    [filteredDeliveries]="filteredDeliveries"
    [itemSize]="itemSize"
    [canCreate]="canCreate"
    [canConfirm]="canConfirm"
    [userNames]="userNamesMap"
    (refresh)="refresh($event)"
    (statusFilterChange)="setStatusFilter($event)"
    (create)="openCreateModal()"
    (confirmPickup)="openPickupDialog($event)"
  />
}

<hlm-alert-dialog #pickupDialog="hlmAlertDialog">
  <hlm-alert-dialog-content *hlmAlertDialogPortal="let ctx">
    <hlm-alert-dialog-header>
      <hlm-alert-dialog-media>
        <ng-icon name="lucideUserCheck" />
      </hlm-alert-dialog-media>
      <h2 hlmAlertDialogTitle>Confirmar Retirada</h2>
      <p hlmAlertDialogDescription>Informe o nome de quem está retirando a encomenda.</p>
    </hlm-alert-dialog-header>

    <div class="pickup-dialog__field" style="display:flex;flex-direction:column;gap:0.5rem;padding:0 0.25rem 0.5rem;">
      <label hlmFieldLabel for="pickup-name">Nome completo</label>
      <input
        hlmInput
        id="pickup-name"
        type="text"
        [(ngModel)]="pickupName"
        placeholder="Nome de quem retira"
        autocomplete="name"
      />
    </div>

    <hlm-alert-dialog-footer>
      <button hlmAlertDialogCancel type="button">Cancelar</button>
      <button
        hlmAlertDialogAction
        type="button"
        [disabled]="!pickupName.trim()"
        (click)="confirmPickup()"
      >
        Confirmar
      </button>
    </hlm-alert-dialog-footer>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
