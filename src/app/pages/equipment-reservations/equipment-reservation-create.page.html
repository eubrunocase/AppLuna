@if (layout.isDesktop()) {
  <app-equipment-reservation-create-desktop
    [step]="step()"
    [selectedDate]="selectedDate()"
    [startTime]="startTime()"
    [endTime]="endTime()"
    [durationHours]="durationHours()"
    [isSubmitting]="isSubmitting()"
    [canProceedStep1]="canProceedStep1()"
    [canSubmit]="canSubmit()"
    [minPickerDate]="minPickerDate"
    [pickerDate]="pickerDate()"
    (dateChange)="onDateChange($event)"
    (slotChange)="onSlotChange($event)"
    (goToStep)="goToStep($event)"
    (submit)="onSubmit()"
  />
} @else {
  <app-equipment-reservation-create-mobile
    [step]="step()"
    [startTime]="startTime()"
    [durationHours]="durationHours()"
    [isSubmitting]="isSubmitting()"
    [canProceedStep1]="canProceedStep1()"
    [canSubmit]="canSubmit()"
    [minPickerDate]="minPickerDate"
    [pickerDate]="pickerDate()"
    (dateChange)="onDateChange($event)"
    (slotChange)="onSlotChange($event)"
    (goToStep)="goToStep($event)"
    (submit)="onSubmit()"
  />
}
