@if (layout.isDesktop()) {
  <app-equipment-reservations-desktop
    [statusFilters]="statusFilters"
    [statusFilter]="statusFilter"
    [searchQuery]="searchQuery"
    [isLoading]="isLoading"
    [filteredReservations]="filteredReservations"
    [processingId]="processingId"
    [canCreate]="canCreate"
    [canManage]="canManage"
    (statusFilterChange)="setStatusFilter($event)"
    (searchQueryChange)="setSearchQuery($event)"
    (handover)="askHandover($event)"
    (returnItem)="askReturn($event)"
    (create)="openCreate()"
    (refreshList)="loadReservations()"
  />
} @else {
  <app-equipment-reservations-mobile
    [statusFilters]="statusFilters"
    [statusFilter]="statusFilter"
    [searchQuery]="searchQuery"
    [isLoading]="isLoading"
    [skeletonItems]="skeletonItems"
    [filteredReservations]="filteredReservations"
    [itemSize]="itemSize"
    [processingId]="processingId"
    [canCreate]="canCreate"
    [canManage]="canManage"
    (refresh)="refresh($event)"
    (statusFilterChange)="setStatusFilter($event)"
    (searchQueryChange)="setSearchQuery($event)"
    (handover)="askHandover($event)"
    (returnItem)="askReturn($event)"
    (create)="openCreate()"
  />
}

<app-confirm-dialog
  #confirmDialog
  [title]="confirmTitle"
  [description]="confirmDescription"
  [confirmLabel]="confirmLabel"
  [icon]="confirmIcon"
  (confirmed)="confirmAction()"
/>
