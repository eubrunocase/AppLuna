version: 1
frontend:
  phases:
    preBuild:
      commands:
        - export NVM_DIR="$HOME/.nvm"
        - 'source $NVM_DIR/nvm.sh'
        - nvm install 22.22.3
        - nvm use 22.22.3
    build:
      commands:
        - node --version
        - npm ci --cache .npm --prefer-offline
        - npm run build
  artifacts:
    baseDirectory: www
    files:
      - '**/*'
